name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        # The mobile test preload evaluates web Firebase modules while
        # registering platform doubles. These values are deliberately fake:
        # they satisfy Firebase's config shape without granting access to a
        # project or allowing tests to depend on production credentials.
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: test-api-key
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: test-project
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:123456789:web:test'
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-test
        run: bun run test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Test Firestore rules
        run: bun run test:firestore-rules

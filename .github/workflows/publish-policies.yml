name: Publish Timber policies

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: timber-policies-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload policy pages only
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/policies
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
